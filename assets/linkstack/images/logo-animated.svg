<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="41.75 42.12 172 172" role="img" aria-label="Antares">
  <style>
    .ring { stroke-dasharray: 511.5; stroke-dashoffset: 511.5; transform-box: fill-box; transform-origin: center;
            transform: rotate(-90deg); animation: draw 1.1s ease-out forwards; }
    .a, .star { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .a { animation: drop .8s cubic-bezier(.2,.8,.2,1) .35s forwards; }
    .star { animation: spark 1s cubic-bezier(.2,.8,.2,1) .8s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes drop { from { opacity: 0; translate: 0 -40%; } to { opacity: 1; translate: 0 0; } }
    @keyframes spark {
      0%   { opacity: 0; scale: .2; rotate: -180deg; }
      70%  { opacity: 1; scale: 1.15; rotate: 10deg; }
      100% { opacity: 1; scale: 1; rotate: 0deg; }
    }
  </style>
  <circle class="ring" cx="127.75" cy="128.12" r="81.4" fill="none" stroke="#7ad21c" stroke-width="2.6"/>
  <path class="a" stroke="#7ad21c" stroke-width="1.6" stroke-linejoin="round" fill="#7ad21c" d="M120.6 72.5 H133.6 L159.2 135.7 H143.4 L128 100.4 L112.6 135.7 H96.6 Z"/>
  <path class="star" stroke="#7ad21c" stroke-width="1.2" stroke-linejoin="round" fill="#7ad21c" d="M128 117.5 L136.6 144.6 L159.2 152.2 L136.6 159.8 L128 184 L119.4 159.8 L96.8 152.2 L119.4 144.6 Z"/>
</svg>
